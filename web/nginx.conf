server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Access body API (FastAPI service in docker-compose). Resolved per request via Docker's DNS, so nginx
    # also starts while the orchestrator is (re)starting, and follows a recreated container's new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api http://orchestrator:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Hashed build assets can be cached for long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback; the HTML shell is always revalidated so a reload picks up a new build
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
