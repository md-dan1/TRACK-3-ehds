services:

  db_nord:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      HOSPITAL_DATA_DIR: /data
    ports:
      - "5432:5432"
    volumes:
      - ./hospitals/Klinikum_Nord:/data:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    tmpfs:
      - /var/lib/postgresql/data

  db_sud:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      HOSPITAL_DATA_DIR: /data
    ports:
      - "5433:5432"
    volumes:
      - ./hospitals/Klinikum_Sued:/data:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    tmpfs:
      - /var/lib/postgresql/data

  db_west:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      HOSPITAL_DATA_DIR: /data
    ports:
      - "5434:5432"
    volumes:
      - ./hospitals/Klinikum_West:/data:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    tmpfs:
      - /var/lib/postgresql/data
